    <path d="M6 108 Q12 112 18 108" fill="none" stroke="#D88A8F" stroke-width="2" stroke-linecap="round"/>
    <path d="M-18 130 Q12 118 42 130 L38 172 Q12 180 -14 172 Z" fill="#C8474F"/>
